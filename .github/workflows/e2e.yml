name: E2E (Tauri)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: E2E (${{ matrix.os }} · Vite + mock)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_E2E: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Native Tauri run is opt-in (requires Rust + WebView2 + tauri-driver):
      #   TAURI_E2E_NATIVE=1 pnpm e2e
      # By default CI runs against the mocked Tauri backend (Vite at 1420, no Rust).
      # Mock inlines src-tauri/assets/quran.json / cities / daily fixtures so specs
      # assert the same shapes the Rust handlers return.

      - name: Run E2E (Vite + mocked Tauri)
        run: pnpm e2e
        env:
          CI: "true"
          TAURI_E2E: "1"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test-results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
